version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod
  modules-download-mode: vendor
  allow-parallel-runners: true
  tests: true
  go: "1.26"

linters:
  default: standard
  exclusions:
    rules:
      # Cleanup failures in tests do not affect assertions; production code
      # remains subject to errcheck.
      - path: _test\.go
        linters:
          - errcheck
      # Keep staticcheck's correctness checks without enforcing optional
      # quick-fix rewrites that make control flow less readable here.
      - linters:
          - staticcheck
        text: "QF1003:"

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
      colors: true
  sort-order:
    - linter
    - severity
    - file
  show-stats: true
