name: CI

on:
  push:
    branches: [legacy, main]
  pull_request:
    branches: [legacy, main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=vendor

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify source and tests
        run: make verify

      - name: Stress relay concurrency
        run: make test-stress

      - name: Upload coverage
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./coverage.out
          flags: unittests
          name: patchwork
          token: ${{ env.CODECOV_TOKEN }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build production binary
        run: >-
          go build -trimpath
          -ldflags "-s -w -X main.version=ci -X main.commit=${{ github.sha }}"
          -o patchwork .

      - name: Smoke-test binary metadata
        run: |
          ./patchwork --help
          ./patchwork --version | grep -F "patchwork version ci"

  release-config:
    name: Release config
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean --skip=publish

  container:
    name: Container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Smoke-test native image
        run: |
          build_date="$(date --utc --date="@$(git show -s --format=%ct)" +%Y-%m-%dT%H:%M:%SZ)"
          make container-smoke \
            REGISTRY=localhost IMAGE_TAG=ci VERSION=ci \
            COMMIT="$GITHUB_SHA" BUILD_DATE="$build_date"

      - name: Verify multi-architecture image
        run: |
          build_date="$(date --utc --date="@$(git show -s --format=%ct)" +%Y-%m-%dT%H:%M:%SZ)"
          make container-build-multiarch \
            MANIFEST_NAME=localhost/patchwork-ci-manifest VERSION=ci \
            COMMIT="$GITHUB_SHA" BUILD_DATE="$build_date"
          architectures="$(podman manifest inspect localhost/patchwork-ci-manifest |
            jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' | sort)"
          expected="$(printf '%s\n' linux/amd64 linux/arm64 | sort)"
          test "$architectures" = "$expected"

  publish-container:
    name: Publish container
    if: github.event_name == 'push'
    needs: [verify, lint, build, release-config, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build multi-architecture image
        run: |
          build_date="$(date --utc --date="@$(git show -s --format=%ct)" +%Y-%m-%dT%H:%M:%SZ)"
          make container-build-multiarch \
            MANIFEST_NAME=localhost/patchwork-publish-manifest \
            VERSION="0.0.0-${GITHUB_REF_NAME//\//-}" \
            COMMIT="$GITHUB_SHA" BUILD_DATE="$build_date"

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push branch and commit tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          branch_tag="$(printf '%s' "$GITHUB_REF_NAME" |
            tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g')"
          short_sha="${GITHUB_SHA:0:7}"
          tags=("$branch_tag" "sha-$short_sha")
          for tag in "${tags[@]}"; do
            podman manifest push --all localhost/patchwork-publish-manifest \
              "docker://$image:$tag"
          done
