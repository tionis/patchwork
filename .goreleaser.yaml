version: 2

builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -mod=vendor
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    binary: patchwork
    main: .
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - assets/patchwork.sh

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^build:'

release:
  github:
    owner: tionis
    name: patchwork
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## Patchwork {{ .Tag }} ({{ .Date }})
    
    Welcome to this new release!

  footer: |
    ## OCI Images
    
    Multi-architecture OCI images are available at:
    - `ghcr.io/tionis/patchwork:{{ .Tag }}`
    - `ghcr.io/tionis/patchwork:latest`
    
    ## Installation
    
    ### Binary Installation
    
    Download the appropriate binary for your platform from the assets below.
    
    ### Podman
    
    ```bash
    podman run -p 8080:8080 -e SECRET_KEY=change-me ghcr.io/tionis/patchwork:{{ .Tag }}
    ```
    
    ### From Source
    
    ```bash
    go install github.com/tionis/patchwork@{{ .Tag }}
    ```
